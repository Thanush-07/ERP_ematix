version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: erp_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: college_erp

  redis:
    image: redis:7.2-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: erp_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: ./server/.env
    depends_on:
      - mongodb
      - redis

  client:
    build: ./client
    container_name: erp_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
